<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتب الشركة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef; --panel:#ffffff; --ink:#1d1b18; --muted:#6f6a61; --line:#e6e1d6;
    --accent:#b4572e; --accent-soft:#f6e6dc; --ok:#2f7d4f; --ok-soft:#e3f1e8;
    --warn:#a86b00; --warn-soft:#fbefd6; --bad:#b23a3a; --bad-soft:#f8e1e1;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16140f; --panel:#201d18; --ink:#f1ede4; --muted:#a39d91; --line:#34302a;
      --accent:#e08a5f; --accent-soft:#3a271d; --ok:#6cc08f; --ok-soft:#1d3226;
      --warn:#e5b04c; --warn-soft:#3a2f17; --bad:#ec7b7b; --bad-soft:#3d2020;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.6}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:24px;margin:0}
  .sub{color:var(--muted);font-size:13px}
  .clock{font-variant-numeric:tabular-nums;font-weight:600}
  .conn{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--line);color:var(--muted)}
  .conn.live{background:var(--ok-soft);color:var(--ok)}
  .conn.off{background:var(--bad-soft);color:var(--bad)}
  section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
  h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .count{background:var(--accent);color:#fff;border-radius:99px;font-size:12px;padding:1px 9px}
  .empty{color:var(--muted);font-size:14px;padding:6px 0}
  /* waiting */
  #waiting{border:2px solid var(--accent)}
  .need{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--bg)}
  .need-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .need-title{font-weight:600}
  .tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-inline-start:6px}
  .need-body{font-size:14px;color:var(--muted);margin:6px 0;white-space:pre-wrap}
  .rec{font-size:14px;margin:4px 0}
  .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
  input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
  input.note{flex:1;min-width:160px}
  button{font:inherit;border:0;border-radius:10px;padding:7px 14px;cursor:pointer;font-weight:600}
  button:disabled{opacity:.5;cursor:default}
  .b-ok{background:var(--ok);color:#fff}
  .b-no{background:var(--bad-soft);color:var(--bad)}
  .b-main{background:var(--accent);color:#fff}
  a{color:var(--accent)}
  /* staff */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .desk{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}
  .desk-head{display:flex;align-items:center;gap:8px}
  .emoji{font-size:24px}
  .desk-name{font-weight:600}
  .pill{font-size:12px;padding:1px 8px;border-radius:99px;margin-inline-start:auto;white-space:nowrap}
  .st-busy{background:var(--ok-soft);color:var(--ok)}
  .st-idle{background:var(--line);color:var(--muted)}
  .st-stuck{background:var(--bad-soft);color:var(--bad)}
  .desk-cur{font-size:13px;color:var(--muted);margin:6px 0;min-height:21px}
  .lvl{font-size:12px;display:flex;justify-content:space-between;color:var(--muted)}
  .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
  .bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
  /* tasks */
  .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media (max-width:820px){.cols{grid-template-columns:1fr 1fr}}
  @media (max-width:520px){.cols{grid-template-columns:1fr}}
  .col{background:var(--bg);border-radius:12px;padding:10px;min-height:80px}
  .col h3{font-size:14px;margin:0 0 8px;color:var(--muted);display:flex;justify-content:space-between}
  .task{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:14px}
  .task.blocked{border-color:var(--bad)}
  .task .meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
  .hi{color:var(--bad);font-weight:600}
  .addtask{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .addtask input{flex:1;min-width:180px}
  /* events */
  .ev{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .ev:last-child{border-bottom:0}
  .ev time{color:var(--muted);font-size:12px;white-space:nowrap;min-width:92px;font-variant-numeric:tabular-nums}
  .ev .who{font-weight:600;white-space:nowrap}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:820px){.two{grid-template-columns:1fr}}
  .resolved .need{opacity:.75}
  .notice{font-size:13px;color:var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:10px;margin-bottom:12px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🏢 مكتب الشركة</h1>
      <div class="sub">استوديو علي الكندري للإعلانات · <span class="clock" id="clock"></span></div>
    </div>
    <span class="conn" id="conn">يتصل…</span>
  </header>

  <div class="notice" id="notice"></div>

  <section id="waiting">
    <h2>🙋 ينتظرك <span class="count" id="needCount">0</span></h2>
    <div class="sub" style="margin-bottom:10px">كل موافقة تخص هذا البند بس. الموافقة ما تشمل أي شي بعده.</div>
    <div id="needs"><div class="empty">يحمّل…</div></div>
  </section>

  <section>
    <h2>👥 الفريق</h2>
    <div class="grid" id="staff"><div class="empty">يحمّل…</div></div>
  </section>

  <section>
    <h2>📋 المهام</h2>
    <form class="addtask" id="addTask" hidden>
      <input id="tTitle" placeholder="مهمة جديدة للفريق…" maxlength="200" required>
      <select id="tOwner"></select>
      <select id="tPri"><option value="عادي">عادي</option><option value="عالي">عالي</option></select>
      <button class="b-main" type="submit">أضف</button>
    </form>
    <div class="cols" id="tasks"></div>
  </section>

  <div class="two">
    <section>
      <h2>📰 آخر الأحداث</h2>
      <div id="events"><div class="empty">يحمّل…</div></div>
    </section>
    <section class="resolved">
      <h2>🗂️ قراراتك الأخيرة</h2>
      <div id="done"><div class="empty">ما فيه قرارات للحين.</div></div>
    </section>
  </div>
</div>

<script>
(function(){
  const TZ = "Asia/Kuwait";
  const fmtTime = new Intl.DateTimeFormat("ar-KW-u-nu-latn",{hour:"numeric",minute:"2-digit",hour12:true,timeZone:TZ});
  const fmtDay  = new Intl.DateTimeFormat("ar-KW-u-nu-latn",{weekday:"short",day:"numeric",month:"short",timeZone:TZ});
  const fmtFull = new Intl.DateTimeFormat("ar-KW-u-nu-latn",{weekday:"long",day:"numeric",month:"long",hour:"numeric",minute:"2-digit",hour12:true,timeZone:TZ});
  const LEVELS = [0,50,120,220,350,520,730,1000,1350,1800];
  const LEVEL_NAMES = ["متدرب","مساعد","منفّذ","منفّذ أول","أخصائي","أخصائي أول","خبير","خبير أول","قائد","شريك"];
  const STAGES = [["backlog","قائمة الانتظار"],["doing","قيد الشغل"],["review","مراجعة"],["done","خلص"]];
  const $ = id => document.getElementById(id);
  const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const safeUrl = u => /^https:\/\//i.test(String(u||"")) ? String(u) : "";
  const when = iso => { const d = new Date(iso); return isNaN(d) ? "" : fmtDay.format(d)+" · "+fmtTime.format(d); };

  function tick(){ $("clock").textContent = fmtFull.format(new Date()); }
  tick(); setInterval(tick, 30000);

  const state = {staff:[], events:[], tasks:[], needs:[]};
  let db = null, canWrite = false;

  function staffName(id){ const s = state.staff.find(x=>x.id===id); return s ? (s.emoji||"")+" "+(s.name||id) : (id==="owner"?"👤 المالك":id); }
  function levelOf(xp){ let l=1; for(let i=0;i<LEVELS.length;i++) if(xp>=LEVELS[i]) l=i+1; return l; }

  function renderNeeds(){
    const pend = state.needs.filter(n=>n.status==="pending").sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));
    $("needCount").textContent = pend.length;
    $("needs").innerHTML = pend.length ? pend.map(n=>{
      const link = safeUrl(n.link);
      return `<div class="need" data-id="${esc(n.id)}">
        <div class="need-top"><div class="need-title">${esc(n.title)}<span class="tag">${esc(n.kind||"قرار")}</span></div>
        <div class="sub">${esc(staffName(n.from))} · ${esc(when(n.createdAt))}</div></div>
        ${n.detail?`<div class="need-body">${esc(n.detail)}</div>`:""}
        ${n.cost?`<div class="rec">💸 التكلفة: <b>${esc(n.cost)}</b></div>`:""}
        ${n.recommend?`<div class="rec">💡 المقترح: ${esc(n.recommend)}</div>`:""}
        ${link?`<div class="rec"><a href="${esc(link)}" target="_blank" rel="noopener">افتح الملف</a></div>`:""}
        ${canWrite?`<div class="actions">
          <input class="note" placeholder="ملاحظة (اختياري)" maxlength="300">
          <button class="b-ok" data-act="approved">✅ موافق</button>
          <button class="b-no" data-act="rejected">✖ رفض</button></div>`:""}
      </div>`;}).join("") : `<div class="empty">ما فيه شي ينتظرك. 👌</div>`;

    const res = state.needs.filter(n=>n.status!=="pending").sort((a,b)=>String(b.resolvedAt).localeCompare(String(a.resolvedAt))).slice(0,8);
    $("done").innerHTML = res.length ? res.map(n=>`<div class="ev"><time>${esc(when(n.resolvedAt))}</time>
      <div>${n.status==="approved"?"✅":"✖"} ${esc(n.title)}${n.ownerNote?` <span class="sub">— ${esc(n.ownerNote)}</span>`:""}</div></div>`).join("")
      : `<div class="empty">ما فيه قرارات للحين.</div>`;
  }

  function renderStaff(){
    const order = ["ceo","sales","scout","content","production","publishing"];
    const list = state.staff.slice().sort((a,b)=>(order.indexOf(a.id)+99)%99-(order.indexOf(b.id)+99)%99);
    $("staff").innerHTML = list.length ? list.map(s=>{
      const xp = Number(s.xp)||0, l = levelOf(xp);
      const lo = LEVELS[l-1], hi = LEVELS[l] ?? LEVELS[LEVELS.length-1];
      const pct = l>=10 ? 100 : Math.max(2, Math.round((xp-lo)/(hi-lo)*100));
      const cls = s.status==="يشتغل"?"st-busy":s.status==="متوقف"?"st-stuck":"st-idle";
      return `<div class="desk"><div class="desk-head"><span class="emoji">${esc(s.emoji)}</span>
        <div><div class="desk-name">${esc(s.name)}</div></div>
        <span class="pill ${cls}">${esc(s.status||"فاضي")}</span></div>
        <div class="desk-cur">${s.current?esc(s.current):"—"}</div>
        <div class="lvl"><span>مستوى ${l} · ${LEVEL_NAMES[l-1]}</span><span>${xp} XP</span></div>
        <div class="bar" role="meter" aria-valuemin="${lo}" aria-valuemax="${hi}" aria-valuenow="${xp}" aria-label="نقاط الخبرة"><i style="width:${pct}%"></i></div>
      </div>`;}).join("") : `<div class="empty">ما فيه موظفين على اللوحة للحين.</div>`;
    const sel = $("tOwner");
    const cur = sel.value;
    sel.innerHTML = list.map(s=>`<option value="${esc(s.id)}">${esc(s.emoji)} ${esc(s.name)}</option>`).join("");
    if(cur) sel.value = cur;
  }

  function renderTasks(){
    $("tasks").innerHTML = STAGES.map(([k,label])=>{
      let ts = state.tasks.filter(t=>(t.stage||"backlog")===k);
      ts.sort((a,b)=>(a.priority==="عالي"?0:1)-(b.priority==="عالي"?0:1) || String(b.updatedAt).localeCompare(String(a.updatedAt)));
      if(k==="done") ts = ts.slice(0,10);
      return `<div class="col"><h3><span>${label}</span><span>${ts.length}</span></h3>${
        ts.map(t=>{const link=safeUrl(t.link); return `<div class="task ${t.blocked?"blocked":""}">${t.blocked?"⛔ ":""}${esc(t.title)}
          <div class="meta"><span>${esc(staffName(t.owner))}</span>${t.priority==="عالي"?`<span class="hi">عالي</span>`:""}
          ${t.due?`<span>📅 ${esc(t.due)}</span>`:""}${link?`<a href="${esc(link)}" target="_blank" rel="noopener">رابط</a>`:""}</div></div>`;}).join("")
        || `<div class="empty">—</div>`}</div>`;
    }).join("");
  }

  function renderEvents(){
    const ev = state.events.slice().sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,30);
    const icon = {done:"✅",start:"▶️",blocked:"⛔",need:"🙋",approved:"👍",rejected:"✖",xp:"⭐",note:"📝",publish:"📣"};
    $("events").innerHTML = ev.length ? ev.map(e=>`<div class="ev"><time>${esc(when(e.at))}</time>
      <div><span class="who">${esc(staffName(e.who))}</span> ${icon[e.type]||"•"} ${esc(e.text)}</div></div>`).join("")
      : `<div class="empty">ما فيه أحداث للحين.</div>`;
  }

  function renderAll(){ renderNeeds(); renderStaff(); renderTasks(); renderEvents(); }
  renderAll();

  function notice(msg){ const n=$("notice"); n.textContent=msg; n.style.display=msg?"block":"none"; }
  function conn(cls, txt){ const c=$("conn"); c.className="conn "+cls; c.textContent=txt; }

  async function logEvent(who,type,text,ref){
    try{ await db.collection("events").add({at:new Date().toISOString(),who,type,text,ref:ref||""}); }catch(e){}
  }

  $("needs").addEventListener("click", async ev=>{
    const btn = ev.target.closest("button[data-act]"); if(!btn || !db) return;
    const box = btn.closest(".need"); const id = box.dataset.id; const act = btn.dataset.act;
    const note = (box.querySelector("input.note")||{}).value || "";
    const n = state.needs.find(x=>x.id===id); if(!n) return;
    box.querySelectorAll("button").forEach(b=>b.disabled=true);
    try{
      await db.doc("needs/"+id).update({status:act,resolvedAt:new Date().toISOString(),ownerNote:note.trim()});
      await logEvent("owner", act, (act==="approved"?"وافق على: ":"رفض: ")+n.title+(note.trim()?" — "+note.trim():""), id);
    }catch(e){
      box.querySelectorAll("button").forEach(b=>b.disabled=false);
      notice("ما قدرنا نحفظ القرار. جرّب مرة ثانية.");
    }
  });

  $("addTask").addEventListener("submit", async ev=>{
    ev.preventDefault(); if(!db) return;
    const title = $("tTitle").value.trim(); if(!title) return;
    const owner = $("tOwner").value || "ceo"; const priority = $("tPri").value;
    const now = new Date().toISOString();
    const btn = ev.target.querySelector("button"); btn.disabled = true;
    try{
      const ref = await db.collection("tasks").add({title,owner,stage:"backlog",priority,due:"",blocked:false,link:"",createdAt:now,updatedAt:now,by:"owner"});
      await logEvent("owner","note","أضاف مهمة لـ "+staffName(owner)+": "+title, ref.id);
      $("tTitle").value = "";
    }catch(e){ notice("ما قدرنا نضيف المهمة."); }
    btn.disabled = false;
  });

  async function start(){
    db = await claude.use("db");
    if(!db){ conn("off","غير متصل"); notice("اللوحة ما تقدر توصل لقاعدة البيانات في هذا العرض. سجّل دخولك في claude.ai وافتحها من هناك."); ["needs","staff","events"].forEach(id=>$(id).innerHTML='<div class="empty">ما فيه اتصال.</div>'); return; }
    try{
      const user = await claude.use("user");
      if(user){ const o = await user.isOwner(); const w = await user.can("data.write"); canWrite = !!o || (o==null && w!==false); }
      else canWrite = true;
    }catch(e){ canWrite = false; }
    $("addTask").hidden = !canWrite;

    const pending = new Set(["staff","events","tasks","needs"]);
    const timer = setTimeout(()=>{ if(pending.size) notice("البيانات ما وصلت للحين، ممكن تكون قديمة."); }, 10000);
    const sub = (name, q) => q.onSnapshot(snap=>{
      state[name] = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
      if(!snap.metadata.fromCache){ pending.delete(name); if(!pending.size){ clearTimeout(timer); notice(""); conn("live","مباشر ●"); } }
      renderAll();
    }, err=>{ pending.delete(name); clearTimeout(timer); conn("off","انقطع"); notice("انقطع الاتصال باللوحة ("+(err && err.code)+"). حدّث الصفحة لاحقًا."); });
    sub("staff", db.collection("staff"));
    sub("events", db.collection("events").orderBy("at","desc").limit(60));
    sub("tasks", db.collection("tasks"));
    sub("needs", db.collection("needs"));
  }
  if(window.claude && claude.use) start(); else { conn("off","غير متصل"); notice("افتح اللوحة من claude.ai عشان تشتغل البيانات الحية."); }
})();
</script>
</body>
</html>
